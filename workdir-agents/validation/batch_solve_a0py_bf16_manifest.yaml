# LAZY ALLOCATION — BF16 5-seed full run (SCI-548): GA-BF16 Ultra, separate-job drivers on CPU, shared router(lazypool_bf16) + 2-node BF16 workers.
# Identical swarm to the validated Stage-2 / 5seed manifest (shared HTTP-MCP
# sidecars worklog:9101 benchmark:9102 python:9103 on 127.0.0.1 + EXTERNAL shared
# sandbox). The ONLY operational difference vs the 5seed run is WHERE each driver
# lands: NS_PREHOSTED_PARTITION=batch places every prehosted driver on its OWN GPU
# `batch` node (1 driver / node → no shared-FS import contention; normal QOS
# node=1000 → no CPU-QOS ceiling, all 5 seeds get clean walltime). Sidecar ports
# need NO per-seed offset because each driver is on a separate node.
#
# Bring up shared services (router+sandbox) FIRST, publishing to lazypool_bf16; then:
#   NS_PREHOSTED_PARTITION=batch \
#   NS_GYM_SIDECAR_SCRIPT=/alaptev/router_pool/gym_sidecars_q2_s<k>.sh \
#   ns hermes_agent_rollouts --cluster aws-cmh \
#     --agent_manifest workdir-agents/validation/batch_solve_a0py_q2_manifest.yaml \
#     --input_file /alaptev/data/batch_solve_a0py_full2158_input.jsonl \
#     --output_dir /alaptev/exp/a0py_q2_s<k> --expname lazyalloc_q2_s<k> \
#     --no-merge_back --no-with_sandbox --qos normal \
#     --server_container .../sglang-v0.5.11.sqsh --gym_container .../nemo-skills-dc43f3e.sqsh
#     --sandbox_container .../nemo-skills-sandbox-dc43f3e.sqsh
#     --hermes_agent_path /alaptev/hermes-agent --gym_path /alaptev/NeMo-Gym

template_hermes_home: /alaptev/NeMo-Gym/responses_api_agents/hermes_agent/hermes_home_template_swarm100_proc
trace_dir_subpath: traces

sandbox:
  mounts: []

agents:
  scientist:
    role: orchestrator
    model: /hf_models/NVIDIA-Nemotron-3-Ultra-550B-A55B-BF16
    prehosted_url: "$(cat /alaptev/data/lazypool_bf16/router_url)/v1"
    hermes:
      max_turns: 60
      enabled_toolsets:
        - delegation
        - mcp-worklog
        - mcp-benchmark
        - mcp-python
      disabled_toolsets:
        - file
        - memory
        - terminal
        - code_execution
        - web
        - browser
        - skills
        - send_message
        - cronjob
        - kanban
      persist_memory: false
      persist_skills: false
      persist_session: false
      save_trajectories: true
      enable_compression: false
      disable_streaming: true
      completion_marker: "Final Answer:"
      mcp_servers:
        worklog:
          url: "http://127.0.0.1:9101/mcp"
        benchmark:
          url: "http://127.0.0.1:9102/mcp"
        python:
          url: "http://127.0.0.1:9103/mcp"
